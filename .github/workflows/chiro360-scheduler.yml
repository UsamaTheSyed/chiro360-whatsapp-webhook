name: Chiro360 → WhatsApp Daily/Weekly Reports

on:
  schedule:
    - cron: '0 8 * * 1-5'    # 4am Eastern when on EDT (UTC-4)
    - cron: '0 9 * * 1-5'    # 4am Eastern when on EST (UTC-5)
    - cron: '30 22 * * 1-5'  # 6:30pm Eastern when on EDT (UTC-4)
    - cron: '30 23 * * 1-5'  # 6:30pm Eastern when on EST (UTC-5)

  # Manual trigger
  workflow_dispatch:
    inputs:
      run_time:
        description: 'Which reports to run'
        required: true
        default: '5pm'
        type: choice
        options:
          - '4am'
          - '5pm'
          - 'all'

jobs:
  send-reports:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Determine run time (scheduled)
        id: schedule
        run: |
          # America/Detroit auto-adjusts for DST, so this is always
          # the real current Eastern local time, no manual updates needed.
          LOCAL_TIME=$(TZ='America/Detroit' date +%H:%M)
          echo "Current Eastern local time: $LOCAL_TIME"

          if [ "$LOCAL_TIME" = "04:00" ]; then
            echo "run_time=4am" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$LOCAL_TIME" = "18:30" ]; then
            # Internal key stays "5pm" - it just selects the evening
            # report set in scheduler.js, the actual send time is 6:30pm.
            echo "run_time=5pm" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # One of the other 2 scheduled triggers firing on the "wrong"
            # half of the year for current DST status - skip silently.
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Chiro360 Report Automation
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.should_run == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RUN_TIME: ${{ github.event.inputs.run_time || steps.schedule.outputs.run_time }}

          CHIRO360MI_EMAIL: ${{ secrets.CHIRO360MI_EMAIL }}
          CHIRO360MI_PASSWORD: ${{ secrets.CHIRO360MI_PASSWORD }}
          CHIRO360MI_WHATSAPP_NUMBER: ${{ secrets.CHIRO360MI_WHATSAPP_NUMBER }}

          FINISHLINEPTMI_EMAIL: ${{ secrets.FINISHLINEPTMI_EMAIL }}
          FINISHLINEPTMI_PASSWORD: ${{ secrets.FINISHLINEPTMI_PASSWORD }}
          FINISHLINEPTMI_WHATSAPP_NUMBER: ${{ secrets.FINISHLINEPTMI_WHATSAPP_NUMBER }}
        run: node scheduler.js
