name: Chiro360 → WhatsApp Daily/Weekly Reports

on:
  # 4am Detroit time (Mon-Fri) = 8am UTC
  schedule:
    - cron: '0 8 * * 1-5'
    
  # 5pm Detroit time (Mon-Fri) = 9pm UTC
    - cron: '0 21 * * 1-5'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      run_time:
        description: 'Which reports to run'
        required: true
        default: '5pm'
        type: choice
        options:
          - '4am'
          - '5pm'
          - 'all'

jobs:
  send-reports:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Determine run time (scheduled)
        id: schedule
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "08" ]; then
            echo "run_time=4am" >> $GITHUB_OUTPUT
          else
            echo "run_time=5pm" >> $GITHUB_OUTPUT
          fi
      
      - name: Run Chiro360 Report Automation
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RUN_TIME: ${{ github.event.inputs.run_time || steps.schedule.outputs.run_time }}

          CHIRO360MI_EMAIL: ${{ secrets.CHIRO360MI_EMAIL }}
          CHIRO360MI_PASSWORD: ${{ secrets.CHIRO360MI_PASSWORD }}
          CHIRO360MI_WHATSAPP_NUMBER: ${{ secrets.CHIRO360MI_WHATSAPP_NUMBER }}

          FINISHLINEPTMI_EMAIL: ${{ secrets.FINISHLINEPTMI_EMAIL }}
          FINISHLINEPTMI_PASSWORD: ${{ secrets.FINISHLINEPTMI_PASSWORD }}
          FINISHLINEPTMI_WHATSAPP_NUMBER: ${{ secrets.FINISHLINEPTMI_WHATSAPP_NUMBER }}
        run: node scheduler.js
