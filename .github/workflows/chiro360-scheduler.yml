name: Chiro360 → WhatsApp Daily/Weekly Reports

on:
  schedule:
    # 5pm Monday-Friday (Detroit time = UTC-4 or UTC-5)
    # 9pm UTC Mon-Fri (covers both EST and EDT)
    - cron: '0 21 * * 1-5'
    
    # Friday 5pm (for weekly reports)
    # This runs same time as above but we'll generate all reports
    
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  send-reports:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Chiro360 Report Automation
        env:
          CHIRO360_EMAIL: ${{ secrets.CHIRO360_EMAIL }}
          CHIRO360_PASSWORD: ${{ secrets.CHIRO360_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: node scheduler.js
