name: Chiro360 → WhatsApp Daily/Weekly Reports

on:
  # 4am Detroit time (Mon-Fri) = 8am UTC
  schedule:
    - cron: '0 8 * * 1-5'
    
  # 5pm Detroit time (Mon-Fri) = 9pm UTC
    - cron: '0 21 * * 1-5'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      run_time:
        description: 'Which reports to run'
        required: true
        default: '5pm'
        type: choice
        options:
          - '4am'
          - '5pm'
          - 'all'

jobs:
  send-reports:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Chiro360 Report Automation
        env:
          CHIRO360_EMAIL: ${{ secrets.CHIRO360_EMAIL }}
          CHIRO360_PASSWORD: ${{ secrets.CHIRO360_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: node scheduler.js
