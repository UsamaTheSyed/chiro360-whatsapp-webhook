name: Make sample PDF
on: workflow_dispatch

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --no-save puppeteer
      - run: node generateAgenda.js
        env:
          SAMPLE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-pdf
          path: sample-agenda.pdf
          retention-days: 1
